name: ci-cd-eks

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Set to true to intentionally fail CI"
        required: true
        default: "false"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION != '' && secrets.AWS_REGION || 'eu-west-2' }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY != '' && secrets.ECR_REPOSITORY || 'hello-world-app' }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME != '' && secrets.EKS_CLUSTER_NAME || 'hello-world-eks' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run basic tests
        run: |
          python -m py_compile app/app.py

      - name: Simulate CI failure
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulate_failure == 'true' }}
        run: |
          echo "Intentional CI failure for scenario demo"
          exit 1

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      image_repository: ${{ steps.meta.outputs.image_repository }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null

      - name: Build and push image
        id: meta
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_REPOSITORY=$ECR_REGISTRY/$ECR_REPOSITORY
          IMAGE_URI=$IMAGE_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image_repository=$IMAGE_REPOSITORY" >> $GITHUB_OUTPUT
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

  terraform:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    outputs:
      cluster_name: ${{ steps.cluster_name_output.outputs.cluster_name }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check if EKS cluster already exists
        id: cluster_check
        run: |
          if aws eks describe-cluster --name "${{ env.EKS_CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Terraform Init
        if: steps.cluster_check.outputs.exists == 'false'
        run: terraform init

      - name: Terraform Validate
        if: steps.cluster_check.outputs.exists == 'false'
        run: terraform validate

      - name: Terraform Plan
        if: steps.cluster_check.outputs.exists == 'false'
        run: terraform plan -input=false -var "cluster_name=${{ env.EKS_CLUSTER_NAME }}" -var "aws_region=${{ env.AWS_REGION }}"

      - name: Terraform Apply
        if: steps.cluster_check.outputs.exists == 'false'
        run: terraform apply -auto-approve -input=false -var "cluster_name=${{ env.EKS_CLUSTER_NAME }}" -var "aws_region=${{ env.AWS_REGION }}"

      - name: Export cluster output
        id: tf_output
        if: steps.cluster_check.outputs.exists == 'false'
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT

      - name: Set cluster name output
        id: cluster_name_output
        run: |
          if [ "${{ steps.cluster_check.outputs.exists }}" = "true" ]; then
            echo "cluster_name=${{ env.EKS_CLUSTER_NAME }}" >> $GITHUB_OUTPUT
          else
            echo "cluster_name=${{ steps.tf_output.outputs.cluster_name }}" >> $GITHUB_OUTPUT
          fi

  helm-deploy:
    runs-on: ubuntu-latest
    needs: [terraform, build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure EKS API endpoint is publicly reachable
        run: |
          set +e
          OUTPUT=$(aws eks update-cluster-config \
            --name ${{ needs.terraform.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }} \
            --resources-vpc-config endpointPublicAccess=true,endpointPrivateAccess=true,publicAccessCidrs=0.0.0.0/0 2>&1)
          RC=$?
          set -e

          if [ $RC -ne 0 ]; then
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "already at the desired configuration"; then
              echo "EKS endpoint config already correct; continuing."
            else
              exit $RC
            fi
          fi

          aws eks wait cluster-active \
            --name ${{ needs.terraform.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ needs.terraform.outputs.cluster_name }} --region ${{ env.AWS_REGION }}

      - name: Ensure GitHub role has EKS access
        run: |
          set +e
          ENTRY_OUTPUT=$(aws eks create-access-entry \
            --cluster-name ${{ needs.terraform.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }} \
            --principal-arn ${{ secrets.AWS_ROLE_ARN }} \
            --type STANDARD 2>&1)
          ENTRY_RC=$?
          set -e

          if [ $ENTRY_RC -ne 0 ]; then
            echo "$ENTRY_OUTPUT"
            if echo "$ENTRY_OUTPUT" | grep -q "already exists"; then
              echo "Access entry already exists; continuing."
            else
              exit $ENTRY_RC
            fi
          fi

          set +e
          POLICY_OUTPUT=$(aws eks associate-access-policy \
            --cluster-name ${{ needs.terraform.outputs.cluster_name }} \
            --region ${{ env.AWS_REGION }} \
            --principal-arn ${{ secrets.AWS_ROLE_ARN }} \
            --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy \
            --access-scope type=cluster 2>&1)
          POLICY_RC=$?
          set -e

          if [ $POLICY_RC -ne 0 ]; then
            echo "$POLICY_OUTPUT"
            if echo "$POLICY_OUTPUT" | grep -q "ResourceInUseException"; then
              echo "Access policy already associated; continuing."
            else
              exit $POLICY_RC
            fi
          fi

      - name: Helm upgrade/install
        run: |
          helm upgrade --install hello-world ./helm/hello-world \
            --set image.repository=${{ needs.build-and-push.outputs.image_repository }} \
            --set image.tag=${{ needs.build-and-push.outputs.image_tag }} \
            --set image.pullPolicy=Always
